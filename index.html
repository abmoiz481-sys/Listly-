<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Listly &mdash; AI Real Estate Brochure Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>

  :root{
    --bg:#0E1116;
    --bg-elevated:#161A21;
    --bg-panel:#12151C;
    --bg-field:#0B0D12;
    --border:#262B35;
    --border-soft:#1D212A;
    --text:#EDEFF3;
    --text-dim:#98A0AE;
    --text-faint:#5C6270;
    --brass:#CBA135;
    --brass-bright:#E4C468;
    --brass-soft:rgba(203,161,53,0.14);
    --success:#3FAE6B;
    --success-soft:rgba(63,174,107,0.14);
    --danger:#E1685A;
    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-ui:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --shadow-panel:0 20px 50px -20px rgba(0,0,0,0.6);
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:radial-gradient(120% 140% at 20% -10%, #171B24 0%, #0E1116 45%, #0A0C10 100%);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }

  body{
    min-height:100vh;
    padding-bottom:64px;
  }

  ::selection{ background:var(--brass-soft); color:var(--brass-bright); }

  button{ font-family:inherit; }

  input,textarea{
    font-family:inherit;
    color:var(--text);
    background:var(--bg-field);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    font-size:15px;
    outline:none;
    width:100%;
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  input::placeholder, textarea::placeholder{ color:var(--text-faint); }

  input:focus, textarea:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 4px var(--brass-soft);
    background:#0D1017;
  }

  textarea{
    resize:vertical;
    min-height:120px;
    line-height:1.55;
  }

  /* ---------- App shell ---------- */

  .app-shell{
    max-width:1180px;
    margin:0 auto;
    padding:22px 18px 0 18px;
  }

  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:38px;
    height:38px;
    border-radius:10px;
    background:linear-gradient(145deg, var(--brass-bright), #8B6B1F);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:16px;
    color:#181307;
    flex-shrink:0;
    box-shadow:0 6px 16px -6px rgba(203,161,53,0.6);
  }

  .brand-name{
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.1;
  }

  .brand-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-top:2px;
  }

  .plan-pill{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    padding:8px 12px;
    border-radius:999px;
    font-size:12px;
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .18s ease, transform .12s ease;
  }

  .plan-pill:active{ transform:scale(0.96); }

  .plan-pill:hover{ border-color:var(--brass); }

  .plan-pill .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--brass);
    box-shadow:0 0 0 3px var(--brass-soft);
    flex-shrink:0;
  }

  /* ---------- Hero section ---------- */

  .hero-section{
    text-align:center;
    padding:8px 6px 22px 6px;
    margin-bottom:4px;
  }

  .hero-headline{
    font-size:23px;
    font-weight:700;
    line-height:1.28;
    letter-spacing:-0.01em;
    color:var(--text);
    margin-bottom:12px;
    max-width:460px;
    margin-left:auto;
    margin-right:auto;
  }

  .hero-subheadline{
    font-size:14px;
    line-height:1.55;
    color:var(--text-dim);
    max-width:420px;
    margin:0 auto 20px auto;
  }

  .hero-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    padding:0 26px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg, var(--brass-bright), #A9812A);
    color:#1B1507;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 14px 30px -12px rgba(203,161,53,0.6);
    transition:transform .12s ease;
  }

  .hero-cta:active{ transform:scale(0.97); }

  .hero-microcopy{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--text-faint);
    margin-top:14px;
  }

  .usage-strip{
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:14px 16px;
    margin-bottom:18px;
    cursor:pointer;
    transition:border-color .18s ease;
  }

  .usage-strip:hover{ border-color:var(--border); }

  .usage-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:9px;
  }

  .usage-label{
    font-size:12.5px;
    color:var(--text-dim);
  }

  .usage-label strong{ color:var(--text); font-weight:600; }

  .usage-cta{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--brass-bright);
    text-transform:uppercase;
  }

  .usage-track{
    height:6px;
    border-radius:999px;
    background:var(--bg-field);
    overflow:hidden;
    border:1px solid var(--border-soft);
  }

  .usage-fill{
    height:100%;
    width:66%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--brass), var(--brass-bright));
  }

  /* ---------- Auth header ---------- */

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }

  .auth-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    padding:9px 14px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    white-space:nowrap;
    min-height:38px;
    transition:border-color .18s ease, transform .12s ease;
  }

  .auth-btn:active{ transform:scale(0.96); }
  .auth-btn:hover{ border-color:var(--brass); }

  .user-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    padding:6px 12px 6px 6px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    min-height:38px;
    transition:border-color .18s ease, transform .12s ease;
  }

  .user-chip:active{ transform:scale(0.96); }

  .user-chip-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--brass-bright), #8B6B1F);
    color:#1B1507;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:11.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .user-chip-email{
    font-size:12px;
    color:var(--text-dim);
    max-width:110px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .pro-flag{
    background:var(--brass-soft);
    color:var(--brass-bright);
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:0.05em;
    padding:2px 7px;
    border-radius:999px;
    border:1px solid rgba(203,161,53,0.5);
    text-transform:uppercase;
    flex-shrink:0;
  }

  .auth-tabs{
    display:flex;
    background:var(--bg-field);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px;
    gap:4px;
    margin-bottom:18px;
  }

  .auth-tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    padding:11px 8px;
    border-radius:999px;
    cursor:pointer;
    min-height:44px;
  }

  .auth-tab-btn.active{
    background:linear-gradient(135deg, var(--brass-bright), #A9812A);
    color:#1B1507;
  }

  .auth-form-panel{ display:none; }
  .auth-form-panel.active{ display:block; }

  .auth-error{
    display:none;
    background:rgba(225,104,90,0.1);
    border:1px solid rgba(225,104,90,0.4);
    color:var(--danger);
    font-size:12.5px;
    padding:11px 13px;
    border-radius:var(--radius-sm);
    margin-bottom:14px;
    line-height:1.5;
  }

  .auth-error.active{ display:block; }

  .auth-success{
    display:none;
    background:var(--success-soft);
    border:1px solid rgba(63,174,107,0.4);
    color:var(--success);
    font-size:12.5px;
    padding:11px 13px;
    border-radius:var(--radius-sm);
    margin-bottom:14px;
    line-height:1.5;
  }

  .auth-success.active{ display:block; }

  .auth-submit-btn{
    width:100%;
    min-height:52px;
    border-radius:var(--radius-md);
    border:none;
    background:linear-gradient(135deg, var(--brass-bright), #A9812A);
    color:#1B1507;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .auth-submit-btn:active{ transform:scale(0.97); }

  .auth-submit-btn[disabled]{ opacity:0.6; pointer-events:none; }

  .auth-hint{
    text-align:center;
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:14px;
    line-height:1.5;
  }

  /* ---------- Pro gating ---------- */

  .locked-overlay{
    position:relative;
  }

  .locked-overlay::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(10,11,14,0.55);
    border-radius:var(--radius-md);
    backdrop-filter:blur(1.5px);
    pointer-events:none;
  }

  .locked-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--brass-soft);
    color:var(--brass-bright);
    border:1px solid rgba(203,161,53,0.4);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:999px;
  }

  .brand-color-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bg-field);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
  }

  .brand-color-input{
    width:44px;
    height:44px;
    border-radius:10px;
    border:1px solid var(--border);
    padding:0;
    cursor:pointer;
    background:transparent;
    flex-shrink:0;
  }

  .brand-color-label{
    font-size:12.5px;
    color:var(--text-dim);
  }

  .brand-color-value{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text);
    margin-top:2px;
  }

  .gen-limit-banner{
    display:none;
    background:rgba(225,104,90,0.08);
    border:1px dashed rgba(225,104,90,0.4);
    color:#F0B4AC;
    font-size:12px;
    line-height:1.55;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    margin-bottom:14px;
  }

  .gen-limit-banner.active{ display:block; }

  .gen-limit-banner strong{ color:var(--danger); }

  /* ---------- Tabs ---------- */

  .tab-switcher{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    padding:6px;
    border-radius:var(--radius-md);
    margin-bottom:18px;
  }

  .tab-btn{
    border:none;
    background:transparent;
    color:var(--text-dim);
    padding:13px 10px;
    border-radius:var(--radius-sm);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .18s ease, color .18s ease;
  }

  .tab-btn.active{
    background:var(--bg-elevated);
    color:var(--text);
    box-shadow:inset 0 0 0 1px var(--border);
  }

  .tab-btn .tab-icon{ font-size:15px; }

  .content-grid{ display:block; }

  .editor-panel, .preview-panel{ display:none; }
  .editor-panel.active, .preview-panel.active{ display:block; }

  /* ---------- Cards / sections ---------- */

  .panel-card{
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    padding:20px;
    margin-bottom:16px;
    box-shadow:var(--shadow-panel);
  }

  .panel-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }

  .panel-title{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--text-dim);
    font-family:var(--font-mono);
  }

  /* ---------- Template switcher ---------- */

  .template-scroll{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }

  .template-scroll::-webkit-scrollbar{ display:none; }

  .template-pill{
    flex:0 0 auto;
    width:150px;
    background:var(--bg-field);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px;
    cursor:pointer;
    text-align:left;
    transition:border-color .18s ease, transform .14s ease, background .18s ease;
  }

  .template-pill:active{ transform:scale(0.97); }

  .template-pill.active{
    border-color:var(--brass);
    background:linear-gradient(160deg, rgba(203,161,53,0.12), rgba(203,161,53,0.02));
    box-shadow:0 0 0 3px var(--brass-soft);
  }

  .template-swatch{
    height:44px;
    border-radius:8px;
    margin-bottom:10px;
    position:relative;
    overflow:hidden;
  }

  .template-swatch.tp-luxury{ background:linear-gradient(135deg,#F5F1E8,#E7DEC7); }
  .template-swatch.tp-luxury::after{ content:""; position:absolute; left:10%; right:10%; bottom:8px; height:2px; background:#CBA135; }

  .template-swatch.tp-neon{ background:radial-gradient(circle at 30% 30%, #1A0F2E, #0A0713 70%); }
  .template-swatch.tp-neon::after{ content:""; position:absolute; inset:6px; border:1px solid #4CE0D2; border-radius:5px; box-shadow:0 0 10px #4CE0D2, inset 0 0 10px rgba(76,224,210,0.4); }

  .template-swatch.tp-classic{ background:linear-gradient(135deg,#16233A,#22385C); }
  .template-swatch.tp-classic::after{ content:""; position:absolute; inset:5px; border:1px solid #C9A227; border-radius:2px; }

  .template-pill-name{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    margin-bottom:2px;
  }

  .template-pill-desc{
    font-size:10.5px;
    color:var(--text-faint);
    line-height:1.4;
  }

  /* ---------- Form fields ---------- */

  .field-group{ margin-bottom:16px; }
  .field-group:last-child{ margin-bottom:0; }

  .field-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .field-row-3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
  }

  .ai-inline-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--brass-soft);
    color:var(--brass-bright);
    border:1px solid rgba(203,161,53,0.35);
    padding:6px 11px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    text-transform:none;
    font-family:var(--font-ui);
    transition:background .18s ease, transform .12s ease;
  }

  .ai-inline-btn:active{ transform:scale(0.95); }
  .ai-inline-btn:hover{ background:rgba(203,161,53,0.22); }

  .currency-toggle{
    display:flex;
    background:var(--bg-field);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    gap:3px;
  }

  .currency-option{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.02em;
    padding:6px 10px;
    border-radius:999px;
    cursor:pointer;
    text-transform:none;
    white-space:nowrap;
    transition:background .18s ease, color .18s ease;
  }

  .currency-option.active{
    background:linear-gradient(135deg, var(--brass-bright), #A9812A);
    color:#1B1507;
  }

  .hint-text{
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:8px;
    line-height:1.5;
  }

  /* ---------- Image upload ---------- */

  .image-upload-zone{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg-field);
    border:1.5px dashed var(--border);
    border-radius:var(--radius-md);
    padding:12px;
    margin-bottom:12px;
  }

  .image-thumb{
    width:64px;
    height:64px;
    border-radius:10px;
    flex-shrink:0;
    background:linear-gradient(160deg,#1E2330,#12151C);
    border:1px solid var(--border);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-faint);
    font-size:20px;
  }

  .image-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .image-upload-info{ flex:1; min-width:0; }

  .image-upload-title{
    font-size:13px;
    font-weight:600;
    margin-bottom:2px;
  }

  .image-upload-desc{
    font-size:11px;
    color:var(--text-faint);
    line-height:1.4;
  }

  .file-input-hidden{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    overflow:hidden;
    pointer-events:none;
  }

  .image-btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
  }

  .upload-btn{
    min-height:48px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--bg-elevated);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }

  .upload-btn:active{ transform:scale(0.97); }

  .upload-btn.danger{
    color:var(--danger);
    border-color:rgba(225,104,90,0.4);
    background:rgba(225,104,90,0.08);
  }

  /* ---------- Preview canvas ---------- */

  .canvas-wrap{
    background:radial-gradient(120% 120% at 50% 0%, #1B1F28, #0E1116 70%);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-xl);
    padding:22px 16px 26px 16px;
    margin-bottom:16px;
  }

  .canvas-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:16px;
    padding:0 4px;
  }

  .canvas-label .live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
